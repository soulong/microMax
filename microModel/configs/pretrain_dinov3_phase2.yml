# =============================================================================
# DINOv3 SSL 预训练 —— Phase 2：Gram 锚定（密集特征精修）
# =============================================================================
#   用途：在 Phase 1 自监督结果之上做"Gram anchoring"——用冻结的早期教师（即 resume.ssl_model，Phase 1 的 model.pt）约束 student 的 patch 特征 Gram 矩阵，缓解长程训练/大模
#   型导致的密集特征退化（论文 §4）。Phase 2 会继续与 Phase 1 相同的视图流，并追加 2 个高分辨率 gram crop。
#
#   使用前提：先跑 pretrain_dinov3_phase1.yml 得到 <phase1 输出>/model.pt，然后把 resume.ssl_model 指向它
#   （继续优化 student/teacher；它同时就是 gram 冻结锚，无需单独配置）。resume.type 建议 continue
#   （同数据精确续跑）；换数据请用 transfer。
#
#   与 Phase 1 的差异（其余参数见 phase1 文件逐键注释）：
#     - dinov3.gram.use_loss: true 及整块 gram 配置生效
#     - augmentation_views 末尾追加 2 个 448px gram teacher crop 视图
#     - 更保守的调度：LR/动量/权重衰减取常数，LR 降低到 5e-5，轮数约为 Phase 1 的 1/3 数据特征沿用 Phase 1：crop 129–224 px、~5K–50K 细胞、单通道 16-bit 荧光；
#      head 21845、4 个 local 视图与 Phase 1 保持一致（bundle 会锁定架构，resume 时以 bundle 为准）。
# =============================================================================

mode: single_cell

method: dinov3

output_dir: 2026-09-14_dinov3_phase2

data:
  #  file_list: 数据清单 CSV 列表（deduplication 的 curated.csv，或任意 [filepath(,label)] 清单；统一写成列表——单个数据源也用单元素列表，多个 CSV 的并集就是数据
  #  池）。配置后清单就是全部数据，data.file_dir 被忽略（日志警告）。filepath 相对路径按进程 CWD 解析——与 curated.csv 的生成约定一致，从 deduplication 的运行目录启
  #  动即可。pretrain 忽略 label 列。
  file_list: # null
    - sc_dataset/deduplication/curated.csv
  file_dir:
    # - sc_dataset/deduplication/curated/NCOA2_293T_63x_epi
    # - sc_dataset/deduplication/curated/opencell_single_cell
    # - sc_dataset/deduplication/curated/p53
  image_pattern: null                 # 文件名正则提取元数据；null = 不提取
  max_value: 65535                    # 输入 dtype 最大强度（16-bit=65535 / 8-bit=255），加载时图像除以它归一化到 [0,1]
  channels: [1]                       # 1-based 通道下标；单细胞荧光通常单通道；null = 全部
  channel_layout: null                # CHW | HWC | null（一文件一通道）
  sample_max: null                    # null = 不限制；5K 以下小数据集别设上限；数据集很大(>100K)想加速迭代可设 20000
  sample_by: per_dataset              # per_dataset | per_class（配合 sample_max）

#   Phase 2 = Phase 1 的延续：指向 Phase 1 的 model.pt。continue：模型+优化器+loss 历史从断点恢复（同数据）；transfer：仅权重、epoch 归 0（换数据）。注意
#   continue 的调度语义：Phase 1 结束 epoch ≥ 本 config 的 epochs 时，epochs 被视为"额外轮数"，total_steps 按延长后的区间重算——cosine LR/momentum/WD/temp 从延长
#   曲线的中段继续，而非沿用 Phase 1 曲线终点的值（详见 phase1 config resume 注释）。
resume:
  ssl_model: 2026-09-14_dinov3_phase1/model.pt   # ← 改为 Phase 1 实际输出路径
  type: continue

backbone:
  name: vit_small_patch16_dinov3      # 必须与 Phase 1 一致（架构由 bundle 锁定，resume 时 bundle 获胜）
  pretrained: true                    # Phase 2 由 resume 接管权重，此值仅影响首次创建

dinov3:
  drop_path_rate: 0.1

  # ---- DINO head（与 Phase 1 21845 原型；由 bundle 锁定）----
  head_n_prototypes: 21845
  head_hidden_dim: 2048
  head_bottleneck_dim: 256
  head_nlayers: 3
  ibot_head_n_prototypes: 21845
  ibot_head_hidden_dim: 2048
  ibot_head_bottleneck_dim: 256
  ibot_head_nlayers: 3

  # ---- loss 温度与权重（与 Phase 1 一致）----
  student_temp: 0.1
  sinkhorn_n_iterations: 3
  global_ignore_diagonal: true
  dino_loss_weight: 1.0
  ibot_loss_weight: 1.0
  koleo_loss_weight: 0.1
  reweight_dino_local_loss: false
  local_loss_weight_schedule: null

  # ---- iBOT 掩码（与 Phase 1 一致）----
  mask_ratio_min: 0.1
  mask_ratio_max: 0.5
  mask_sample_probability: 0.5

  # ---- 调度（Phase 2 更收敛：LR/动量/WD 取常数）----
  freeze_last_layer_epochs: 0         # 上一阶段已过防塌缩期，不再冻结
  warmup_epochs: 2                    # 短 warmup 即可（权重已收敛）
  transfer_warmup_epochs: 1
  teacher_temp_start: 0.04
  teacher_temp_end: 0.07              # warmup 期内由 start 线性升至该值（设 start==end 则为常数）
  weight_decay_start: 0.04            # 常数 0.04（与 Phase 1 一致）
  weight_decay_end: 0.04
  momentum_start: 0.994               # Phase 2 教师 EMA 用常数 0.994（官方锚定阶段）
  momentum_end: 0.994
  lr_final: 5.0e-5

  # ---- Gram 锚定（Phase 2 核心）----
  # 官方对照说明：DINOv3 官方没有独立的 phase1/phase2——官方 gram_anchor.yaml 是单次
  # 1200 epoch 连续训练，gram 只在尾部生效（weight 第 1000 epoch 起爬升、首次刷新在
  # 1.01M 迭代、共 3 次后冻结）。等价换算：官方锚定尾段 ≈ 我们的 phase 2；
  # 官方 it_first_update: 1010000 ≡ 我们局部 it_first_update: 0；
  # 官方 weight 爬升 0→2.0 ≡ 我们 phase1 无 gram + phase2 常数 2.0。
  # 下述"官方"均指该合并配置（facebookresearch/dinov3，7B/256px/1.7B 图像）。
  gram:
    use_loss: true                    # 启用 Gram 锚定。官方：锚定阶段 true
    loss_weight: 2.0                  # Gram MSE 损失权重。官方：schedule 从 0 爬升、末端到2.0（仓库默认 1.0）。推荐 2.0（我们的 phase2 整段 = 官方锚定段，实测 dino 仅 +0.004 漂移可承受）；敏感可降 1.0，或用 loss_weight_schedule 复刻官方爬升
    loss_weight_schedule: null        # 权重调度 {start, peak, end, warmup_epochs,cosine_epochs}；null = 常数（官方用 schedule 爬升，常数 2.0 已等价覆盖锚定段）
    ema_teacher: false                # 锚来源：false = 独立冻结教师（初始 = resume.ssl_model，改 resume 即改锚，无单独配置键）；true = 直接以 EMAteacher 为锚（省一张骨干显存，但锚随训练移动，失去冻结参考的意义）。官方 false。推荐 false
    it_load_ema_teacher: -1           # 在指定"本 phase 局部步"用 EMA teacher 硬覆盖锚（-1 = 不覆盖）。官方 -1。推荐 -1
    rep_update: true                  # 允许周期性用当前 EMA teacher 刷新锚（官方 rep_update机制，每 update_frequency 步一次）。推荐 true（配合 max_updates 限次）
    update_frequency: 10000           # 刷新间隔 = 本 phase 启动以来的 batch 数（局部时间轴，与 resume 前的历史步数无关）。官方 10000（1.7B 图像）。推荐 10000（我们 ≈8 epoch/次，40K 图小数据足够密）
    it_first_update: 0                # 首次刷新的最早局部步。官方 1010000（=官方锚定窗起点，等价于我们局部 0）。推荐 0（开局 10k 步即首刷）
    max_updates: 0                    # 本 phase 实际刷新次数上限。官方 3（每 10k 步一次后冻结到训练结束）。推荐 1（40K 窄数据防同质化：旧 lineage不限次数漂到 CDI 0.98；限 1 次后锚永久冻结在 phase1状态。中断续跑自动恢复计数，预算不会重置）
    normalized: true                  # 计算 Gram 前 L2 归一化 patch 特征。官方 true（配置与GramLoss 类默认一致）。推荐 true
    img_level: true                   # 每图一张 Gram 矩阵（B,N,D 逐图）而非整批一张。官方true。推荐 true（显存友好，单细胞每图独立结构）
    remove_neg: false                 # 把负相似度置 0 后再算 MSE。官方锚定配置 false（GramLoss 类默认 true，被官方配置覆盖）。推荐 false
    remove_only_teacher_neg: false    # 仅按教师负位置置 0（与 remove_neg 互斥）。官方 false。推荐 false
    tokens_used: all                  # 参与 Gram 的 token：all | masked | unmasked（后两者要求 img_level: false）。官方 all。推荐 all
    crops_size: 448                   # gram teacher 高分辨率 crop（须整除 16）。官方 512（= 官方全局 256 的 2×）。推荐 448（= 我们全局 224 的 2×，同比例；16G 显存实测可跑，OOM 降 384/224）
    global_teacher_resize_method: bicubic   # teacher 特征空间重采样到 student 网格的方法。官方 bicubic。推荐 bicubic
    global_teacher_resize_antialias: false  # 重采样抗锯齿。官方 false。推荐 false

# =============================================================================
#   augmentation_views —— Phase 2 = Phase 1 的 6 个视图(2 global + 4 local) + 末尾 2 个 gram teacher crop(共 8 个)。顺序约定（train_step 按序切分）：[0:2] =
#   global（student/teacher）[2:2+N] = local（student）[2+N:2+N+2] = gram teacher crops（高分辨率，弱增强）
# =============================================================================
augmentation_views:
  # ---- Global view 1 ----
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - LongestMaxSize: {max_size: 224, p: 1.0}
    - RandomScale: {scale_range: [-0.2, 0.1], p: 0.7}
    - RandomResizedCrop: {size: [224, 224], scale: [0.85, 1.0], ratio: [0.9, 1.1], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.01], contrast_range: [-0.1, 0.2], ensure_safe_output: True, p: 0.7}
    - RandomGamma: {gamma_range: [80, 120], p: 0.7}
    - GaussNoise: {std_range: [0.0005, 0.001], p: 0.5}
    - GaussianBlur: {blur_range: [3, 7], sigma_range: [0.25, 1.0], p: 0.3}
  # ---- Global view 2 ----
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - LongestMaxSize: {max_size: 224, p: 1.0}
    - RandomScale: {scale_range: [-0.1, 0.2], p: 0.7}
    - RandomResizedCrop: {size: [224, 224], scale: [0.65, 1.0], ratio: [0.9, 1.1], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.03], contrast_range: [-0.15, 0.25], ensure_safe_output: True, p: 0.7}
    - RandomGamma: {gamma_range: [80, 120], p: 0.7}
    - GaussNoise: {std_range: [0.0005, 0.002], p: 0.5}
    - GaussianBlur: {blur_range: [1, 5], sigma_range: [0.25, 1.5], p: 0.3}
  # ---- Local 1..2（112×112 细胞级裁剪）+ Local 3..4（112×112 特写：小尺度裁剪 ≈ 2–3 倍有效放大，迫使 patch 特征学习小点/斑点结构）----
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - RandomResizedCrop: {size: [112, 112], scale: [0.4, 0.85], ratio: [0.9, 1.1], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.05], contrast_range: [-0.2, 0.2], ensure_safe_output: True, p: 0.8}
    - GaussNoise: {std_range: [0.0005, 0.002], p: 0.7}
    - GaussianBlur: {blur_range: [1, 5], sigma_range: [0.0, 0.5], p: 0.3}
    - Downscale: {scale_range: [0.8, 1.0], p: 0.2}
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - RandomResizedCrop: {size: [112, 112], scale: [0.3, 0.7], ratio: [0.85, 1.15], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.05], contrast_range: [-0.25, 0.25], ensure_safe_output: True, p: 0.8}
    - RandomGamma: {gamma_range: [80, 120], p: 0.8}
    - GaussNoise: {std_range: [0.0005, 0.002], p: 0.7}
    - GaussianBlur: {blur_range: [3, 7], sigma_range: [0.0, 0.5], p: 0.3}
    - Downscale: {scale_range: [0.8, 1.0], p: 0.2}
  # ---- 特写视图：小尺度裁剪保留斑点细节（blur/Downscale 不得加强）----
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - RandomResizedCrop: {size: [112, 112], scale: [0.12, 0.3], ratio: [0.9, 1.1], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.05], contrast_range: [-0.3, 0.3], p: 0.8}
    - RandomGamma: {gamma_range: [80, 120], p: 0.8}
    - GaussNoise: {std_range: [0.0005, 0.002], p: 0.7}
    - GaussianBlur: {blur_range: [3, 7], sigma_range: [0.0, 0.5], p: 0.3}
    - Downscale: {scale_range: [0.8, 1.0], p: 0.2}
  - - HorizontalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - RandomResizedCrop: {size: [112, 112], scale: [0.1, 0.3], ratio: [0.85, 1.15], mask_interpolation: 0, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.05], contrast_range: [-0.3, 0.3], p: 0.8}
    - RandomGamma: {gamma_range: [80, 120], p: 0.8}
    - GaussNoise: {std_range: [0.0005, 0.002], p: 0.7}
    - GaussianBlur: {blur_range: [3, 7], sigma_range: [0.0, 0.5], p: 0.3}
    - Downscale: {scale_range: [0.8, 1.0], p: 0.2}
  # ---- Phase 2 追加：gram teacher crops（高分辨率 448，弱增强，仅填充分辨率用）----
  - - LongestMaxSize: {max_size: 448, p: 1.0}
    - PadIfNeeded: {min_height: 448, min_width: 448, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.01], contrast_range: [-0.05, 0.05], ensure_safe_output: True, p: 0.3}
  - - LongestMaxSize: {max_size: 448, p: 1.0}
    - PadIfNeeded: {min_height: 448, min_width: 448, p: 1.0}
    - RandomBrightnessContrast: {brightness_range: [0, 0.01], contrast_range: [-0.05, 0.05], ensure_safe_output: True, p: 0.3}

# 推理/UMAP 用确定性增强（必填）
augmentation_infer:
  - LongestMaxSize: {max_size: 224, p: 1.0}
  - PadIfNeeded: {min_height: 224, min_width: 224, p: 1.0}

normalize:
  method: per_channel
  with_masking: false
  fixed_reference: true
  clip_low: 0.05
  clip_high: 99.95

dataloader:
  num_workers: 6
  prefetch_factor: 2
  persistent_workers: true

vis_augment:
  num_samples: 24

monitoring:
  enabled: true
  tensorboard: true
  csv: true
  log_every_steps: 20
  patch_similarity_samples: 6         # patch 相似度图与 attention map 的采样样本数
  attention_maps: true                # 每 save_interval 同时输出 CLS attention map PDF
  gram_split_stats: true              # Phase 2 gram 启用，本项生效（masked/unmasked 分项）
  head_logits_track: true
  embed_source: patch                 # 间隔 epoch UMAP 检查图的 embedding 池化来源（teacher 分支）: cls | patch | cls_patch（cls_patch = 拼接 [CLS, mean-patch]，维度翻倍）；不影响训练本身（SSL 损失直接用 CLS 和 patch token）
  mask_weighted: true                 # UMAP 检查图池化剔除纯背景 patch（二值：patch 含任一前景像素即计入、不乘系数）；仅对 patch/cls_patch 生效

# =============================================================================
# training —— Phase 2 更收敛的优化设置
# =============================================================================
training:
  optimizer: adamw
  lr: 5.0e-5                          # 锚定阶段的低 LR（官方大模型 3e-5；单细胞 5K–50K 用 5e-5）
  weight_decay: 0.04
  betas: [0.9, 0.999]
  grad_clip: 10.0
  grad_accum_steps: 8                 # 32 × 8 = 有效 256；含 gram 前向后显存更大，若 OOM 改 16×16 或 crops_size 降为 384/224
  batch_size: 32
  epochs: 60                          # 约为 Phase 1 的 1/3（Gram 精修阶段）
  save_interval: 20
  n_image_umap: 10000
  amp: true
  
  