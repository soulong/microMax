# =====================================================================================
# micromodel label — 交互式多标签标注配置
# =====================================================================================
# 运行 `micromodel label --config 本文件` 会启动一个本地网页（自动打开浏览器），
# 对裁剪好的单细胞图像做交互式多标签标注：
#
#   - 开始前在网页左侧定义若干标签（可拖动排序、可二次确认删除；标注点击即存，
#     重复运行自动继续）；
#   - 每个细胞可以打任意多个标签（点击 chip = 正例，Shift+点击 = 明确反例）；
#   - 配了 model 时系统按"特征相似度"辅助标注：
#       * 确认建议队列  —— 系统对未标细胞自动推荐标签（kNN 投票 ≥ 阈值），
#                         用户逐个确认（空格 = 接受全部建议并下一个）；
#       * 按标签推荐    —— 对某个标签按相似度降序给细胞排序，收正例最快；
#       * 不确定带      —— 推荐分数在阈值附近震动的细胞（主动学习，对以后训练
#                         分类器信息量最大）；
#       * 复查可疑标注  —— 主动学习的另一半：leave-one-out 一致性检查，把已标
#                         细胞里"离对侧样本比离同侧更近"的可疑误标排在最前
#                         （手滑点错、冷启动期接受的低质建议都会浮出来），
#                         点击 chip 即可翻转/清除，历史记录不丢；
#       * 多样性冷启动  —— 特征空间最远点采样，第一批就覆盖整个隐空间；
#       * 相似近邻条    —— 当前细胞的最近邻一排缩略图，可勾选批量同标。
#
# 推荐原理（与 vis 聚类 / deduplication 同一特征约定）：
#   bundle 提特征（SSL bundle 用 teacher 分支；train 分类 bundle 用其特征输出，
#   并额外用分类头概率作第二推荐来源）→ whitened-PCA + L2 归一 → 余弦相似度。
#   每个标签 score(x) = 与正例的 top-k 平均相似度 − neg_weight × 与"明确反例"的
#   top-k 平均相似度。没标过 ≠ 反例（PU 原则），只有显式拒绝才算反例。
#
# 产出（全部写入 save_dir，源数据一个字节不动；重复运行/换数据集/加标签都安全）：
#   label.db / label_multiple.db   标签注册表（可拖动排序、可二次确认删除）+ 每细胞当前决定
#                    + 完整追加式历史（annotation_log——对同一标签多次标注只是
#                    追加记录+更新当前值）。每次点击立即落盘；再次运行自动加载
#                    已有标注继续（模型 bundle 换了会警告，但人工标注仍有效）
#   label_export.csv 一键导出的 label_csv（filepath,label，多标签用 ";" 连接），
#                    直接喂 micromodel train 的多标签 BCE 模式
#   features/        每 root 特征缓存（deduplication 同款布局：key = bundle 路径+
#                    mtime+size、文件清单、channels 等；新数据/新 bundle 自动失效）
#   micromodel.log   运行日志
#
# 网页显示与模型输入一致：细胞图先走 bundle 的 augmentation_infer 预处理
# （统一正方形模型输入尺寸，小的放大、大的缩小），再做忽略 0 值背景的分位数
# 归一——你看到的就是模型看到的几何。
# =====================================================================================

# 标注工程目录：annotations.db / 导出 / 特征缓存都放在这里。同一个目录反复打开
# 就是同一个标注工程（细胞按绝对路径识别，旧标注原样保留）。
save_dir: sc_dataset\multi_label

# 模型 bundle（可选但强烈推荐）：
#   - SSL 预训练 bundle（无 num_classes）→ teacher 特征 + kNN 推荐；
#   - train 分类 bundle（有 num_classes）→ 同样提特征 + 额外用分类头概率做
#     第二推荐来源，且可一键"从模型类别建标签"；
#   - null = 纯手动模式（无推荐，浏览/筛选/手动打标功能完整）。
# 换 bundle = 换嵌入空间，特征缓存自动失效重建（旧标注不受影响）。
model: 20260830_dinov3_phase2\model.pt

data:
  root:
  # 每个元素是一个"预裁剪单细胞文件夹"（递归枚举 .tif/.tiff，一个文件一个细胞，
  # 背景为 0）。字符串 = 全部继承 data.* 全局默认；字典 = {path: ..., 加任意
  # data.* 键做 per-root 覆盖}（例如 8-bit 数据集用 max_value: 255 混跑）。
  # 后续新增数据集 = 往这里追加路径后重新运行，旧标注/旧标签自动保留。
  # 两个 root 不能有重叠文件（硬报错）；配 model 时 channels 解析后必须等于
  # bundle 的 in_chans（与 infer 相同的硬校验）。
    - sc_dataset\opencell\single_cell
    - sc_dataset\p53\2026-07-10_63x
    - sc_dataset\p53\2026-07-11_63x
    - sc_dataset\p53\2026-07-14_63x
    - sc_dataset\p53\2026-07-18_22_63x
    - sc_dataset\p53\2026-07-18_37_63x
    # 字典写法示例：
    # - path: D:\Model\sc_dataset\hpa\single_cell
    #   max_value: 65535

  # 从文件名提取元数据的正则；null = 不提取。对标注本身无影响，只进入缓存 key。
  image_pattern: null

  # 通道排布：CHW = 通道是 TIFF 的多个 page；HWC = 通道在最后一维；
  # null = 每个文件本身就是单张 2D 图（当前数据全是这种）。未来多通道数据
  # 改这里即可，网页会多通道彩色合成显示（1红 2绿 3蓝 4品红 …）。
  channel_layout: null

  # 提特征/显示用哪些通道（1-based）；null = 文件全部通道。配 model 时解析后
  # 必须等于 bundle 的 in_chans。
  channels: [1]

  # 强度域：载入后除以它归一到 [0,1]（16-bit 用 65535，8-bit 用 255）。必填
  # （全局或 per-root），填错 dtype 会让 percentile 显示与特征都失真。
  max_value: 65535

  # "预设标签"的两级解析（只在网页上作为信息展示，帮助对照已有标签，不会自动
  # 变成正式标注）：
  #   1. label_csv 里的 filepath->label 映射（绝对路径，相对路径相对 CSV 所在目录）；
  #   2. 否则 label_from_dir: true 时用父目录名（如 p53 的 pos/neg）。
  # CSV 配置了但文件不存在 = 硬报错（按 typo 处理）。
  label_from_dir: true
  label_csv: null

recommend:
  # 打分取与该标签已标样本的前 k 个最相似值的平均。k=1（默认）= 纯最近邻检索：
  # 正例少而分散时这是唯一不被稀释的信号（实测 top-4 均值 ~0.01 而最近同类型
  # 邻居 ~0.8）；标注多了以后可调到 3~10 平滑噪声。
  knn_k: 1

  # 反例惩罚权重：score = 正例侧打分 − neg_weight × 反例侧打分。
  # 0.5 = 反例贡献一半负分；0 = 完全忽略反例（不推荐）。
  neg_weight: 0.5

  # 建议阈值：与最近正例的相似度 ≥ 此值且压过反例时才推荐。0.75 附近表示
  # "与已标正例几乎是同一种形态"；调低 = 推得多（快但要多纠错），调高 =
  # 推得少而准。网页顶栏可随时改（对之后加载的队列生效）。
  auto_threshold: 0.75

  # 不确定带宽度：|score − 阈值| ≤ 该值的未标细胞进入"不确定带"队列。
  uncertain_band: 0.15

  # 冷启动批量：多样性队列一次给出的覆盖性样本数（特征空间最远点贪心）。
  # 建议每个预期标签 10~20 个；标完这批 kNN 推荐即可用。
  diverse_size: 48

  # 单细胞视图下方展示的相似近邻个数（也是批量同标的候选池大小）。
  neighbors: 24

space:
  # 推荐空间的 whitened-PCA 维数（对所有已提特征拟合，行再 L2 归一）。
  # 自动被样本数和特征维数封顶；与 deduplication/vis 聚类同一约定，50d 通常够。
  pca_components: 50

dataloader:
  batch_size: 128                      # 特征提取的前向批大小
  num_workers: 6                       # DataLoader 进程数（0 = 主进程加载，慢）
  prefetch_factor: 2                   # 每 worker 预取批数（num_workers=0 时忽略）
  persistent_workers: true             # 特征提取单轮，影响不大

# 随机种子：决定冷启动多样性采样等（特征提取与 PCA 拟合本身是确定性的）。
seed: 42
