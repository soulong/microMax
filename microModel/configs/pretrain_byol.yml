# SSL pretrain config — BYOL method.
# BYOL requires exactly 2 views (views[0:2]; extra views ignored).
#
# Each TIFF under data.root is treated as one cropped single-cell image (no
# labels needed). Bundles saved to {output_dir}/ssl_model.pt (final) and
# ssl_model_{epoch}.pt (every save_interval). Every bundle is complete —
# usable for exact resume, train transfer, and feature extraction.

method: byol

output_dir: runs_byol

data:
  root:
    - D:/single_cell_dataset/opencell/single_cell
  channels: [1]                       # 1-based indices; null = all
  channel_layout: null                # CHW | HWC | null (one-channel-per-file)
  image_pattern: null                 # regex for metadata extraction; null = none
  label_from_dir: true                # ignored by pretrain (label-free)
  label_csv: null                     # ignored by pretrain (label-free)
  sample_max: null                    # null = no limit
  sample_by: per_dataset              # per_dataset | per_class

# resume.ssl_model and resume.type:
#   continue (default) — exact extension: model + optimizer + epoch + loss history restored
#   transfer — domain transfer: model weights only, epoch 0, fresh schedules
resume:
  ssl_model: null                     # SSL bundle to resume; null = fresh run
  type: continue                      # continue | transfer
  
backbone:
  name: convnext_tiny                 # any timm model (conv or ViT)
  pretrained: true                    # ImageNet weights
  
# BYOL projector/predictor dims and training schedules (step-based over total_steps).
byol:
  proj_hidden_dim: 1024
  proj_out_dim: 256
  pred_hidden_dim: 1024
  pred_out_dim: 256
  warmup_epochs: 10                   # linear LR warmup (0 -> lr); then cosine -> lr_final
  transfer_warmup_epochs: 1           # shorter warmup for transfer resume
  momentum_start: 0.996               # teacher momentum EMA; cosine -> momentum_end
  momentum_end: 1.0
  lr_final: 1.0e-6                    # final LR after cosine decay

# Multi-view augmentation. Each top-level entry = one view pipeline.
# BYOL uses views[0:2]; both should end with the same target size.
# ToFloat max_value matches the uint16 export scale (65535) — the percentile
# z-score normalize makes the exact scale benign, but keep it consistent
# with the DINOv2 config.
augmentation_views:
  # View 1 (global)
  - - ToFloat: {max_value: 65535, p: 1.0}
    - RandomScale: {scale_range: [-0.3, 0.1], p: 0.7}
    - CenterCrop: {height: 224, width: 224, pad_if_needed: True, p: 1.0}
    - HorizontalFlip: {p: 0.5}
    - VerticalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - ElasticTransform: {alpha: 5, sigma: 50, p: 0.5}
    - GridDistortion: {distort_range: [-0.1, 0.1], p: 0.5}
    - GaussianBlur: {blur_range: [3, 7], p: 0.7}
  # View 2 (global, distinct aug params)
  - - ToFloat: {max_value: 65535, p: 1.0}
    - RandomScale: {scale_range: [-0.1, 0.1], p: 0.7}
    - CenterCrop: {height: 224, width: 224, pad_if_needed: True, p: 1.0}
    - HorizontalFlip: {p: 0.5}
    - VerticalFlip: {p: 0.5}
    - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.7}
    - RandomBrightnessContrast: {brightness_range: [0, 0], contrast_range: [-0.2, 0.2], ensure_safe_output: True, p: 0.7}
    - RandomGamma: {gamma_range: [70, 130], p: 0.7}
    - GaussianBlur: {blur_range: [3, 5], p: 0.3}

# Deterministic augmentation for inference + UMAP check. REQUIRED.
augmentation_infer:
  - ToFloat: {max_value: 65535, p: 1.0}
  - LongestMaxSize: {max_size: 224, p: 1.0}
  - PadIfNeeded: {min_height: 224, min_width: 224, position: center, p: 1.0}

normalize:
  method: global                      # global | per_channel | null
  with_masking: false
  clip_low: 0.05
  clip_high: 99.95

dataloader:
  num_workers: 6
  prefetch_factor: 3
  persistent_workers: true

vis_augment:
  num_samples: 24

training:
  optimizer: sgd                      # sgd | adamw
  lr: 0.05
  weight_decay: 1.5e-6
  grad_clip: 10.0                     # global gradient norm clip; null = no clipping
  grad_accum_steps: 1                 # accumulate K micro-batches; effective batch = batch_size x K
  batch_size: 96
  epochs: 100
  save_interval: 10
  n_image_umap: 10000                 # max images for periodic UMAP check; 0/null = off
  amp: true
