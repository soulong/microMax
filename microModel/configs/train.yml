# Classification train config — single-cell mode only.
#
# Loads an SSL pretrain bundle (model.pt) OR a timm pretrained backbone,
# adds a ClassificationHead, and trains with FocalLoss. Saves train bundles
# compatible with `micromodel infer` (classify mode):
#   - model.pt (final; eval/best weights, always written)
#   - model_{epoch}.pt (every save_interval; complete bundles, same schema as
#     model.pt, raw training weights + optimizer state for exact resume)

mode: single_cell

method: classification               # classification | segmentation | ...

output_dir: 20260806_train_p53_puncta

data:
  root:
    - sc_dataset/p53/2026-07-10_63x
    - sc_dataset/p53/2026-07-11_63x
    - sc_dataset/p53/2026-07-14_63x
    - sc_dataset/p53/2026-07-18_22_63x
    - sc_dataset/p53/2026-07-18_37_63x
    # - sc_dataset/opencell/single_cell
  image_pattern: null                 # regex for metadata extraction; null = none
  max_value: 65535                    # max possible intensity of the input dtype (65535 for 16-bit, 255 for 8-bit); images are divided by it on load
  channels: [1]                       # 1-based indices; null = all
  channel_layout: null                # CHW | HWC | null (one-channel-per-file)
  label_from_dir: true                # label from parent dir name
  label_csv: null                     # CSV [path, label]; null = not used
  sample_max: null                    # null = no limit
  sample_by: per_dataset              # per_class | per_dataset

# resume.sl_model and resume.ssl_model are mutually exclusive.
resume:
  sl_model: null                      # train bundle (model.pt or any model_{epoch}.pt); mutually exclusive with ssl_model
  ssl_model: 20260805_pretrain_dino/model.pt   # SSL bundle for backbone transfer; null = from scratch

# Augmentation pipeline — list of {AlbumentationsClassName: {kwargs}} dicts.
# train = random transforms; infer = deterministic resize (validation).
# Both must end at the same size (LongestMaxSize + PadIfNeeded + Resize).
# Locked to bundle values when resume.sl_model is set.
augmentation_train:
  - HorizontalFlip: {p: 0.5}
  - Rotate: {angle_range: [-180, 180], border_mode: 0, mask_interpolation: 0, p: 0.5}
  - RandomScale: {scale_range: [-0.1, 0.2], p: 0.7}
  - RandomBrightnessContrast: {brightness_range: [0, 0.02], contrast_range: [-0.1, 0.2], p: 0.7}
  - RandomGamma: {gamma_range: [80, 120], p: 0.7}
  - GaussNoise: {std_range: [0.001, 0.002], p: 0.7}
  - GaussianBlur: {blur_range: [3, 5], p: 0.5}
  - LongestMaxSize: {max_size: 224, p: 1.0}
  - PadIfNeeded: {min_height: 224, min_width: 224, p: 1.0}
augmentation_infer:
  - LongestMaxSize: {max_size: 224, p: 1.0}
  - PadIfNeeded: {min_height: 224, min_width: 224, p: 1.0}

normalize:
  method: global                      # global | per_channel | null
  with_masking: false                 # true = stats from cell foreground only
  fixed_reference: true               # stats on RAW cell, fixed transform per view; preserves brightness/contrast aug
  clip_low: 0.05
  clip_high: 99.95

dataloader:
  num_workers: 6
  prefetch_factor: 3
  persistent_workers: true

model:
  backbone: vit_small_patch14_dinov2.lvd142m  # timm name; used only in from-scratch mode
  pretrained: false                   # load ImageNet weights; from-scratch mode only
  focal_gamma: 2.0                    # 0 = cross-entropy; 2.0 = focal loss

vis_augment:
  num_samples: 24
  num_views: 8

training:
  batch_size: 256
  epochs: 50
  save_interval: 20                   # save a complete model_{epoch}.pt bundle every N epochs; null = no periodic saves
  lr: 0.0001
  weight_decay: 0.01
  betas: [0.9, 0.999]
  val_ratio: 0.25
  amp: true                           # CUDA only; auto-disabled on CPU
  patience: 5                         # early stopping epochs
