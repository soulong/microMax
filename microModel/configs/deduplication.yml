# =====================================================================================
# micromodel deduplication — 隐空间去冗余筛选配置
# =====================================================================================
# 用 SSL 预训练 bundle 的 teacher 分支给每个裁剪单细胞提特征（提取路径与 infer 完全
# 一致：augmentation_infer 和 normalize 全部来自 bundle meta，这里不可配置、也不应该
# 配置），然后在 whitened-PCA + L2 归一的隐空间里用"半径覆盖贪心"选子集：
#
#     按随机顺序逐个检查细胞：它到"已保留集"的最近距离 > 半径 r 才保留；
#     否则它是已保留细胞的冗余近邻副本，丢弃。
#
# 性质：
#   - 稀疏的隐空间区域天然全部保留（每个区域都有保底，不会清空任何一类形态）；
#   - 密集区域被削薄到约 r 间距（只去掉过多冗余）；
#   - 距离在 L2 归一后定义在 [0, 2]（0 = 完全相同，2 = 理论最远），r 是唯一核心旋钮。
#
# 一个规则覆盖两种用法：
#   - 剪枝（prune）  : reference: null，sources = 现有全部数据。给 selection.radius
#                      直接定半径，或给 selection.target_keep 让程序自动二分搜索 r。
#   - 增量（augment）: reference: <上一轮的 selection_state.pkl>——其中保留的细胞成为
#                      不可动的种子；sources 只列新数据集。只有落在种子 r 之外、真正
#                      带来新隐空间区域的细胞才会入选；selection.max_add 限制新增量。
#   想对已经筛过的池子再削一轮：reference: null，sources 列 curated/ 或原文件夹。
#
# 产出（全部写入 output_dir，源文件夹一个字节不动）：
#   selection_state.pkl  保留集（特征+路径+label）——下一轮增量的 reference
#   manifest.csv         每个细胞的 filepath / source / role(seed|source) /
#                        decision(keep|drop) / min_dist / label
#   curated/<root>/      保留文件的硬链接（跨盘自动退化为复制），镜像 root 内相对
#                        结构，可直接作为 pretrain 的 data root；每次运行整个重建。
#                        <root> 是相对所有 root 公共前缀的短名（如 opencell_single_cell）
#   keep_label.csv       label_csv 格式（filepath,label 绝对路径）的保留清单，
#                        直接喂 train；仅当保留细胞有 label 时写出
#   plot_umap.png        UMAP 散点（drop 灰 / keep 绿 / 种子橙），用运行 seed 保证可复现
#   features/            每 root 一个特征缓存 .npz（key = bundle路径+mtime+size、文件
#                        清单、channels/max_value/sample_max 等，任何一项变化自动失效；
#                        调 selection 参数重跑不重新提特征）
# =====================================================================================

# SSL 预训练 bundle（model.pt）。必须是无 num_classes 的 pretrain bundle——
# train 分类 bundle 没有统一的嵌入空间，直接报错退出。
# 注意：换 bundle = 换嵌入空间，特征缓存自动失效，旧 selection_state.pkl 不可再用作
# reference（程序会硬报错，防止两个空间里的距离混比）。
model: 20260830_dinov3_phase2\model.pt

# 所有产出物写入这个目录（会自动创建；curated/ 每次整个重建）。
output_dir: sc_dataset\deduplication

# 上一轮的 selection_state.pkl 路径：
#   null                       = 全新剪枝（sources 之间互相竞争）
#   D:\...\selection_state.pkl = 增量模式（该状态的保留细胞全部作为种子）
reference: null

data:
  root:
  # 每个元素是一个"预裁剪单细胞文件夹"（递归枚举其中全部 .tif/.tiff，一个文件一个
  # 细胞，背景为 0）。两种写法：
  #   - 字符串：全部设置继承下面的 data.* 全局默认；
  #   - 字典：{path: ..., 加任意 data.* 键做 per-root 覆盖}，见下方 hpa 注释示例
  #     （8-bit 数据集用 max_value: 255 与 16-bit 混跑）。
  # 可覆盖键：image_pattern / channel_layout / channels / max_value / label_csv /
  #           label_from_dir。
  # 注意：两个 root 不能有重叠文件（会硬报错）；channels 解析后必须等于 bundle 的
  # in_chans（与 infer 相同的硬校验）。
    - sc_dataset\opencell\single_cell
    - sc_dataset\p53\2026-07-10_63x
    - sc_dataset\p53\2026-07-11_63x
    - sc_dataset\p53\2026-07-14_63x
    - sc_dataset\p53\2026-07-18_22_63x
    - sc_dataset\p53\2026-07-18_37_63x
    # 字典写法示例：
    # - path: D:\Model\sc_dataset\hpa\single_cell
    #   max_value: 255

  # 从文件名提取元数据的正则（命名捕获组成为 manifest 之外的附加信息）；null = 不提取。
  # 对筛选本身无影响，只影响特征缓存 key 与将来的溯源。
  image_pattern: null

  # 通道在文件内的排布：CHW = 通道是 TIFF 的多个 page；HWC = 通道在最后一维；
  # null = 每个文件本身就是单张 2D 图（当前数据全部是这种）。
  channel_layout: null

  # 用哪些通道提特征，1-based 列表；null = 文件里全部通道。
  # 解析后的通道数必须等于 bundle 的 in_chans，否则硬报错。
  channels: [1]

  # 强度域：图像载入后除以它归一到 [0,1]（16-bit 用 65535，8-bit 用 255）。
  # 必填（全局默认或 per-root 覆盖），填错 dtype 会让所有 percentile 归一失真。
  max_value: 65535

  # label 的两级解析（只影响 manifest 的 label 列和 keep_label.csv，不影响特征）：
  #   1. label_csv 里的 filepath->label 映射（绝对路径匹配，相对路径相对 CSV 所在目录解析）；
  #   2. 否则 label_from_dir: true 时用文件的父目录名（如 p53 的 pos/neg）。
  # CSV 配置了但文件不存在 = 硬报错（按 typo 处理，不静默跳过）。
  label_from_dir: true
  label_csv: null                      # 例如 D:\Model\sc_dataset\label.csv

  # 每 root 的细胞数上限（确定性随机下采样，seed 固定则每次选到同一批）。
  # null = 全量。适合先小规模试跑调 selection 参数，再放开全量。
  sample_max: null

selection:
  # 三选一，优先级：radius > max_add（reference 模式）> target_keep。都为 null = 报错。
  #
  # radius      直接指定多样性半径（[0, 2]）。上一轮在本数据池自动搜出 0.6562，
  #             可作为量纲参考：更小 = 保留更多、更同质；更大 = 剪得更狠。
  # target_keep 剪枝模式：最终池子目标总数（种子计入），程序对 r 做二分搜索，
  #             收敛到目标的 1% 容差内。
  # max_add     增量模式：本次最多纳入多少新细胞（对 r 二分）。若新数据与池子高度
  #             重叠，实际新增会少于该值——那正是"只挑有多样性的"的本意。
  radius: null
  target_keep: 50000
  max_add: null

  # 随机种子：决定遍历顺序、sample_max 下采样、UMAP 图。固定则结果可复现。
  seed: 42

space:
  # 筛选空间的 whitened-PCA 维数（对全部候选特征拟合，行再 L2 归一）。
  # 自动被样本数和特征维数封顶；50d 通常保留 ~85% 方差。
  # reference 模式下本键被忽略——必须沿用 reference state 里存的那个 PCA，
  # 否则新细胞和种子不可比（程序会沿用并记一条 warning）。
  pca_components: 50

dataloader:
  batch_size: 128                      # 特征提取的前向批大小
  num_workers: 6                       # DataLoader 进程数（0 = 主进程加载，慢）
  prefetch_factor: 2                   # 每 worker 预取批数（num_workers=0 时忽略）
  persistent_workers: true             # 跨 epoch 保留 worker（推理单轮，影响不大）

output:
  # curated/ 硬链接目录。true = 构建（同盘零拷贝，跨盘自动复制）；每次运行整个
  # 目录先删后建，是纯派生产物，不要手动往里放东西。
  link_dir: true

  # keep_label.csv（label_csv 格式的保留清单，直接作为 train 的 label_csv）。
  # 保留细胞一个 label 都没有时自动跳过并记日志。
  keep_label_csv: true

  # plot_umap.png（对全部参与点拟合 UMAP 后画 keep/drop/seed 散点）。
  # 拟合对几万个点需要一两分钟；只想快速调参数时可设 false。
  plot: true
