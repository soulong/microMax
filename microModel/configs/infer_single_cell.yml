# Inference config — single-cell mode.
#
# Each TIFF under data.root is treated as one pre-cropped single-cell image.
# No masks are needed; results are written to a SQLite DB (infer.db).
#
# The bundle (model) determines classify vs features-only mode:
#   - Train bundle (model.pt): pred_class/pred_prob + features
#   - SSL bundle (model.pt, no num_classes in meta): features only
# augmentation_infer + normalize come from the bundle meta (not configurable).
# All data.* keys are REQUIRED (null is allowed; missing is not).

mode: single_cell

model: 20260806_train_p53_puncta/model.pt         # train bundle (model.pt) or SSL bundle (model.pt)

output_dir: 20260806_train_p53_puncta/infer_sc    # shared DB dir for all roots; null = per-dataset

data:
  root:
    - sc_dataset/p53/2026-07-10_63x
    - sc_dataset/p53/2026-07-11_63x
    - sc_dataset/p53/2026-07-14_63x
    - sc_dataset/p53/2026-07-18_22_63x
    - sc_dataset/p53/2026-07-18_37_63x
    # - sc_dataset/opencell/single_cell
  image_pattern: null                 # regex for metadata extraction; null = none
  max_value: 65535                    # max possible intensity of the input dtype (65535 for 16-bit, 255 for 8-bit); images are divided by it on load
  channels: [1]                       # 1-based indices; null = all; must match model
  channel_layout: null                # CHW | HWC | null (one-channel-per-file)
  label_from_dir: true                # label from parent dir name
  label_csv: null                     # CSV [path, label]; null = not used
  sample_max: 10000                   # null = no limit
  sample_by: per_dataset              # per_class | per_dataset

dataloader:
  num_workers: 4
  prefetch_factor: 2
  persistent_workers: true

inference:
  pred_class: true                    # write pred_class/pred_prob; train bundle only (SSL: warning, skipped)
  feature: true                       # write features BLOB; needed by vis-reduction
  db_name: infer.db
  batch_size: 128

# PCA + UMAP reduction — run via `micromodel vis-reduction --config <this_file>`.
# Reducers are fit once on merged features from all DBs, then applied per-DB.
reduction:
  color_by: [pred_class, pred_prob]   # first = stratification column; valid: pred_class, pred_prob, directory, ground_truth
  var_threshold: 0.95                 # auto PCA dims covering this fraction of variance (min 2); also used as UMAP preprocessing dim
  sample_per_class: 10000             # max points per class to fit reducers; 0 = all
  reducer_pca: null                   # path to pre-fitted PCA .pkl; null = fit new
  reducer_umap: null                  # path to pre-fitted UMAP .pkl; null = fit new
